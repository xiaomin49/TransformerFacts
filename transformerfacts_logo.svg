<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="url(#bg)"/>
  
  <!-- TF Monogram - using path for consistent rendering -->
  <text x="128" y="175" font-family="Arial, sans-serif" font-weight="bold" font-size="130" text-anchor="middle">
    <tspan fill="#ffffff">T</tspan><tspan fill="url(#accent)">F</tspan>
  </text>
  
  <!-- Subtle accent dot -->
  <circle cx="200" cy="56" r="8" fill="#3b82f6" opacity="0.8"/>
</svg>
